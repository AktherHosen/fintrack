name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - run: pnpm --filter @fintrack/shared build

      - name: Setup API env
        run: cp api/.env.example api/.env

      - run: pnpm --filter @fintrack/api db:generate
      - run: pnpm --filter @fintrack/api db:deploy
      - run: pnpm db:seed
      - run: pnpm --filter @fintrack/shared test
      - run: pnpm --filter @fintrack/api test
      - run: pnpm --filter @fintrack/api lint
      - run: pnpm --filter @fintrack/web lint
      - run: pnpm --filter @fintrack/web build
