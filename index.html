<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinTrack" />
    <meta name="application-name" content="FinTrack" />

    <meta
      name="description"
      content="FinTrack — Modern Personal Finance, Budgeting, Loans & Subscription Tracker"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FinTrack — Personal Finance & Wealth Management" />
    <meta property="og:description" content="FinTrack — Modern Personal Finance, Budgeting, Loans & Subscription Tracker" />

    <meta name="twitter:title" content="FinTrack — Personal Finance & Wealth Management" />

    <title>FinTrack — Personal Finance & Wealth Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('fintrack_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="min-h-screen antialiased selection:bg-indigo-500 selection:text-white bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-50"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
